server {
    listen 8080;
    server_name localhost;
    client_max_body_size 32k;
    location / {
        proxy_pass http://web:8508;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
